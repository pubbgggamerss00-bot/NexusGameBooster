# Project-wide Gradle settings.
# CI heap: the Gradle daemon default (512 MB) OOMs in D8 on GitHub Actions runners.
# Local 4 GB sandboxes override this to 1500m via user-level ~/.gradle/gradle.properties
# (user-level properties take precedence over this file).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx2g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
