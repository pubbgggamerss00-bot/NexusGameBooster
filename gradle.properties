# Project-wide Gradle settings.
# NOTE: heap is environment-specific and is NOT set here:
#   - CI (GitHub Actions) sets org.gradle.jvmargs via ORG_GRADLE_PROJECT_* env
#     vars in .github/workflows/android-build.yml (3g — the default 512m daemon
#     OOMs in D8 on runners).
#   - Local 4 GB sandboxes set 1500m via user-level ~/.gradle/gradle.properties
#     (a 3g daemon gets OOM-killed there).
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
