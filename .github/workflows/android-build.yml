# NexusGameBooster — Android CI
#
# Builds the app on every push/PR to main with the committed Gradle wrapper:
#   1. assembleDebug       → debug APK uploaded as a workflow artifact
#   2. testDebugUnitTest   → all JVM unit tests
#   3. lintRelease         → Android Lint (release variant)
#
# Tag releases (v*) additionally build assembleRelease and attach a SIGNED APK
# named NexusGameBooster-<tag>-release.apk to the GitHub Release.
#
# v1.2.1 SIGNING-PERMANENCE FIX: the release keystore IS committed to the repo
# (release.keystore + keystore.properties, see README → "Release signing"), so
# Gradle signs every release build with the permanent v1.2.1+ key — no NGP_*
# repository secrets needed. Update the committed keystore to rotate.

name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Heap is CI-only (see gradle.properties): the default 512m daemon OOMs in D8.
      # org.gradle.jvmargs is a build-env property (NOT readable via ORG_GRADLE_PROJECT_*),
      # so it is appended to gradle.properties here and never committed.
      - name: Configure CI Gradle heap
        run: printf '\n# CI-only heap (added by the workflow, not committed)\norg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g\nkotlin.daemon.jvmargs=-Xmx2g\n' >> gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusGameBooster-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Run Android Lint (release variant)
        run: ./gradlew lintRelease --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/
          if-no-files-found: ignore

  release:
    name: Attach release APK to a tag release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CI Gradle heap
        run: printf '\norg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g\nkotlin.daemon.jvmargs=-Xmx2g\n' >> gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Signed with the committed permanent release keystore (v1.2.1+).
      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename release APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          DEST="NexusGameBooster-${GITHUB_REF_NAME}-release.apk"
          cp "$APK" "$DEST"
          echo "Renamed to $DEST"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusGameBooster-release-apk
          path: NexusGameBooster-*-release.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NexusGameBooster-*-release.apk
